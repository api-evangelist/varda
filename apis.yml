aid: varda
name: Varda
description: 'Varda Space Industries is a microgravity-enabled life sciences company
  that processes materials in orbit and returns them to Earth. Its in-house W-Series
  spacecraft are free-flying orbital production satellites with reentry capability,
  used for in-orbit pharmaceutical crystallization for biopharma partners and as a
  hypersonic reentry testbed for government flight testing. Backed by Founders Fund,
  General Catalyst, Khosla Ventures, and Lux Capital, Varda publishes no public API
  or developer surface as of July 2026.'
